name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release all public packages even without changes
        type: boolean
        default: false
  schedule:
    - cron: "0 0 1 * *"

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/prepare-package-release.yml@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
    permissions:
      actions: write
      contents: write
      pull-requests: read
    with:
      versioning: lerna
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  validate:
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      contents: read
      packages: read
      pull-requests: write
      security-events: write
      id-token: write

  release:
    needs: [prepare, validate]
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/release.yml@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
    permissions:
      actions: read
      contents: write
      pull-requests: read
      id-token: write
    with:
      packages: ${{ needs.prepare.outputs.packages }}
      package-tarball-artifacts: ${{ needs.validate.outputs.package-tarball-artifacts }}
    secrets:
      changelog-summary: ${{ secrets.CHANGELOG_SUMMARY }}

  documentation:
    name: 📚 Publish documentation
    needs: [validate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: prepare-deploy
        uses: hoverkraft-tech/ci-github-publish/actions/deploy/jekyll@5b821495b1c3b68eb2e7fba71992dfe851612ae6 # 3.0.3
        with:
          pages: |
            packages/*/README.md

      - id: deployment
        uses: hoverkraft-tech/ci-github-publish/actions/deploy/github-pages@5b821495b1c3b68eb2e7fba71992dfe851612ae6 # 3.0.3
        with:
          build-path: ${{ steps.prepare-deploy.outputs.build-path }}
