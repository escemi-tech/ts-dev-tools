name: "Pull Request - Semantic Lint"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: main / ☑️ Validate PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository commitlint presets
        uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0
      - name: Validate title
        uses: hoverkraft-tech/ci-github-common/actions/quality/lint-pull-request-title@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
