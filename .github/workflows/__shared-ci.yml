name: Shared - Continuous Integration for common tasks

on:
  workflow_call:
    outputs:
      package-tarball-artifacts:
        description: Validated package tarballs indexed by workspace directory
        value: ${{ jobs.continuous-integration.outputs.package-tarball-artifacts }}
      build-artifact-id:
        description: "The ID of the build artifact"
        value: ${{ jobs.continuous-integration.outputs.build-artifact-id }}

permissions: {}

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@18eb770c5d63c9b9809c367a91c55fb02c138ad4 # 3.0.1
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      package: |
        {
          "tests": "ts-dev-tools --help\nts-dev-tools --version\n"
        }
      build: '{"artifact":"packages/*/dist"}'
      test: |
        {"coverage": "codecov"}
