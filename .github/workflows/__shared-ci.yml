name: Shared - Continuous Integration for common tasks

on:
  workflow_call:
    outputs:
      package-tarball-artifacts:
        description: Validated package tarballs indexed by workspace directory
        value: ${{ jobs.continuous-integration.outputs.package-tarball-artifacts }}
      build-artifact-id:
        description: "The ID of the build artifact"
        value: ${{ jobs.continuous-integration.outputs.build-artifact-id }}

permissions: {}

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      package: |
        {
          "tests": "node \"$PACKAGE_INSTALL_PATH/dist/bin.js\" --help\nnode \"$PACKAGE_INSTALL_PATH/dist/bin.js\" --version\n"
        }
      build: '{"artifact":"packages/*/dist"}'
      test: |
        {"coverage": "codecov"}
