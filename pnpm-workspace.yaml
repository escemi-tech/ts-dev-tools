packages:
  - 'packages/*'
# Disable pnpm's built-in release-age gate (defaults to 1440 minutes); new
# release cooldown is handled by Dependabot (.github/dependabot.yml).
minimumReleaseAge: 0
overrides:
  # Lerna 10.0.1 pins the vulnerable Handlebars 4.7.9 release.
  'lerna>handlebars': 4.7.10
  # Lerna also pins these dependencies before their security fixes.
  'lerna>js-yaml': ^4.3.2
  'lerna>pacote': ^21.5.1
  # Nx 23.3.0 pins Undici before its security fixes.
  'nx>undici': ^7.30.0
  # Dependabot security overrides: force undici past vulnerable releases.
  'undici@>=7.28.0 <7.29.1': '>=7.29.1'
  'undici@>=7.11.0 <7.29.1': '>=7.29.1'
  'undici@>=7.0.0 <7.29.1': '>=7.29.1'
  'undici@>=7.15.0 <7.29.1': '>=7.29.1'
  'undici@>=7.1.0 <7.29.1': '>=7.29.1'
  'undici@>=7.24.1 <7.29.1': '>=7.29.1'
allowBuilds:
  nx: true
  unrs-resolver: true
